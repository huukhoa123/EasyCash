name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build and test
        run: >-
          ./gradlew assembleDebug testDebugUnitTest :domain:test --no-daemon
          '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g'
          '-Pkotlin.compiler.execution.strategy=in-process'
      - name: Verify offline permission and module boundary
        shell: python
        run: |
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          manifest = pathlib.Path('app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml')
          root = ET.parse(manifest).getroot()
          name = '{http://schemas.android.com/apk/res/android}name'
          permissions = [element.get(name) for element in root if element.tag.startswith('uses-permission')]
          assert 'android.permission.INTERNET' not in permissions, 'INTERNET permission is forbidden'
          ui_build = pathlib.Path('ui/build.gradle.kts').read_text()
          assert not re.search(r'project\s*\(\s*["\']:data["\']', ui_build), 'UI must not depend on data'
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: EasyCash-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
